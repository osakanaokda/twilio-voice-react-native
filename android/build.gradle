buildscript {
  ext.versions = [
    'java'               : JavaVersion.VERSION_11,
    'androidGradlePlugin': '7.4.2',
    'googleServices'     : '4.3.10',
    'voiceAndroid'       : '6.7.1',
    'androidxCore'       : '1.12.0',
    'androidxLifecycle'  : '2.2.0',
    'audioSwitch'        : '1.2.2',
    'firebaseMessaging'  : '23.4.0',
    'kotlin'             : '1.9.24'
  ]
  if (project == rootProject) {
    repositories {
      google()
      mavenCentral()
    }

    dependencies {
      classpath "com.android.tools.build:gradle:${versions.androidGradlePlugin}"
      classpath "com.google.gms:google-services:${versions.googleServices}"
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${versions.kotlin}"
    }
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace 'com.twiliovoicereactnative'
  compileSdk safeExtGet('TwilioVoiceReactNative_compileSdkVersion', 34)
  defaultConfig {
    minSdkVersion safeExtGet('TwilioVoiceReactNative_minSdkVersion', 24)
    targetSdkVersion safeExtGet('TwilioVoiceReactNative_targetSdkVersion', 34)
    versionCode 1
    versionName "1.0"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
  lintOptions {
    disable 'GradleCompatible'
  }
  compileOptions {
    sourceCompatibility versions.java
    targetCompatibility versions.java
  }
  buildFeatures {
    // for buildconfig construction
    buildConfig true
  }
}

// Gradle 8+ のタスク依存関係エラー回避: すべてのリソース系タスクでアンダースコア・ハイフン両対応で依存を自動付与
afterEvaluate {
  def resourceTaskPairs = [
    ['packageDebugResources', 'generateDebugResValues'],
    ['packageReleaseResources', 'generateReleaseResValues'],
    ['packageDevelopmentDebugResources', 'generateDevelopmentDebugResValues'],
    ['packageStagingDebugResources', 'generateStagingDebugResValues'],
    ['packageProductionDebugResources', 'generateProductionDebugResValues'],
    ['packageDebugAssets', 'generateDebugAssets'],
    ['packageReleaseAssets', 'generateReleaseAssets'],
    ['parseDebugLocalResources', 'packageDebugResources'],
    ['extractDeepLinksDebug', 'generateDebugResValues'],
    ['compileDebugLibraryResources', 'packageDebugResources'],
    ['generateDebugRFile', 'processDebugManifest'],
    ['generateDebugRFile', 'parseDebugLocalResources'],
    ['copyDebugJniLibsProjectOnly', 'mergeDebugNativeLibs']
  ]
  resourceTaskPairs.each { pair ->
    // 1. 両方ハイフン
    def pkgTask1 = tasks.findByPath(':twilio-voice-react-native-sdk:' + pair[0])
    def genTask1 = tasks.findByPath(':twilio-voice-react-native-sdk:' + pair[1])
    if (pkgTask1 && genTask1) {
      pkgTask1.dependsOn genTask1
    }
    // 2. 両方アンダースコア
    def pkgTask2 = tasks.findByPath(':twilio_voice-react-native-sdk:' + pair[0].replaceAll('-', '_'))
    def genTask2 = tasks.findByPath(':twilio_voice-react-native-sdk:' + pair[1].replaceAll('-', '_'))
    if (pkgTask2 && genTask2) {
      pkgTask2.dependsOn genTask2
    }
    // 3. pkgアンダースコア, genハイフン
    def pkgTask3 = tasks.findByPath(':twilio_voice-react-native-sdk:' + pair[0].replaceAll('-', '_'))
    def genTask3 = tasks.findByPath(':twilio-voice-react-native-sdk:' + pair[1])
    if (pkgTask3 && genTask3) {
      pkgTask3.dependsOn genTask3
    }
    // 4. pkgハイフン, genアンダースコア
    def pkgTask4 = tasks.findByPath(':twilio-voice-react-native-sdk:' + pair[0])
    def genTask4 = tasks.findByPath(':twilio_voice-react-native-sdk:' + pair[1].replaceAll('-', '_'))
    if (pkgTask4 && genTask4) {
      pkgTask4.dependsOn genTask4
    }
    // 5. 名前だけのタスク（project prefixなし）
    def pkgTask5 = tasks.findByName(pair[0])
    def genTask5 = tasks.findByName(pair[1])
    if (pkgTask5 && genTask5) {
      pkgTask5.dependsOn genTask5
    }
  }
}

repositories {
  google()
  mavenCentral()
  maven {
    url 'https://maven.google.com/'
    name 'Google'
  }
}

dependencies {
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"  // From node_modules
  implementation "com.twilio:voice-android:${versions.voiceAndroid}"
  implementation "androidx.core:core:${versions.androidxCore}"
  implementation "androidx.lifecycle:lifecycle-extensions:${versions.androidxLifecycle}"
  implementation "com.google.firebase:firebase-messaging:${versions.firebaseMessaging}"
  implementation "com.twilio:audioswitch:${versions.audioSwitch}"
  implementation 'com.google.android.material:material:1.1.0'
  implementation project(':expo-modules-core')

  constraints {
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
      because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
    }
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
      because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
    }
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.0") {
      because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
    }
  }
}
